# Local development and test database. Matches Neon's major version.
# The credentials below are for this local container only and are not secrets.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: throne
      POSTGRES_PASSWORD: throne
      POSTGRES_DB: iron_throne
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throne -d iron_throne"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
